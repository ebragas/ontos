name: deps
description: Set up Node and Bun, restore node_modules from a cache, and run bun install --frozen-lockfile on a miss.

# The key is the OS, the CPU architecture, the Node version, the Bun lockfile, and each package.json. node_modules
# holds native binaries for 1 architecture, such as @esbuild/linux-x64, so an arm64 runner gets its own cache. A
# changed package.json gives a miss, so bun install --frozen-lockfile still rejects a lockfile that does not match it.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.4.5'
        no-cache: true
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: bun-cache
      with:
        path: ~/.bun/install/cache
        key: bun-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'packages/cli/package.json', 'packages/service/package.json') }}
        restore-keys: |
          bun-cache-${{ runner.os }}-${{ runner.arch }}-
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      id: deps
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: node-modules-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'bun.lock', 'package.json', 'packages/*/package.json') }}
    - if: steps.deps.outputs.cache-hit != 'true'
      shell: bash
      run: bun install --frozen-lockfile
