# Dependabot opens 1 grouped pull request each week for each group below. No pull request merges by itself:
# the tests and CI checks judge each update.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    # Each package pins an exact version, so an update changes the pin.
    versioning-strategy: increase
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # The OSDK set moves on purpose, as 1 set of exact versions, when a feature needs it (Releases "OSDK sets").
    # TypeScript 7.0 removed the JavaScript programmatic compiler API that build.ts, CLI SDK/function discovery, and tools/fallible call.
    # Ignore 7.0.x only so Dependabot opens a pull request when TypeScript 7.1.0 ships with typescript/sync and typescript/ast.
    ignore:
      - dependency-name: '@osdk/*'
      - dependency-name: typescript
        versions:
          - '7.0.x'
    groups:
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      # Group weekly minor and patch updates, and let each major update open its own pull request.
      # One blocked major upgrade must not hold back or fail unrelated major updates.
      other:
        patterns:
          - '*'
        exclude-patterns:
          - '@opentelemetry/*'
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - '*'
  # Covers Dockerfile base images (node:24-alpine); docker-compose.yml stays pinned on PostgreSQL 17 intentionally.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(docker)
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-images:
        patterns:
          - '*'
